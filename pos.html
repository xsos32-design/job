<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>POS RICH 練習機 · SA晚班</title>

<style>
:root{--paper:#0E1116;--card:#171C23;--ink:#EAEDF0;--sub:#94A0AE;--seal:#EE6C56;--sealSoft:#2E1C18;--line:#262D37;--gold:#DDB566;--inkSoft:#20272F;--ok:#4FB477}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--sealSoft);border:1px solid var(--seal);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
h1{font-size:18px;margin:0;letter-spacing:.5px}
.tag{font-size:12px;color:var(--sub);margin:0}
.bar{display:flex;gap:8px;margin:12px 0}
.bar button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--inkSoft);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.bar button.on{background:var(--sealSoft);border-color:var(--seal);color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--gold);letter-spacing:.5px}
.flowlist{display:grid;gap:8px}
.catname{font-size:12px;color:var(--sub);margin:10px 0 2px;letter-spacing:1px}
.fbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--inkSoft);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.fbtn small{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:2px}
.fbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.fbtn.done .dot{background:var(--ok)}
.fbtn .grow{flex:1;min-width:0}
/* POS screen */
.pos{background:#0B2545;border:2px solid #1D3F6E;border-radius:8px;overflow:hidden;font-size:12.5px}
.pos .tb{background:#153A6B;padding:6px 9px;font-size:12px;font-weight:700;color:#DCE7F5;display:flex;justify-content:space-between}
.pos .bd{padding:10px;min-height:96px;background:#0B2545;color:#CBD9EC}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fld span{width:82px;font-size:11.5px;color:#9FB6D4;flex:0 0 auto}
.fld b{flex:1;background:#fff;color:#111;border-radius:3px;padding:3px 7px;font-size:12px;font-weight:600;min-height:22px}
.out{background:#08182E;border:1px solid #1D3F6E;border-radius:4px;padding:8px;font-size:12px;color:#BFD3EC;white-space:pre-line}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px;background:#10233C;border-top:1px solid #1D3F6E}
.keys.m1{grid-template-columns:repeat(4,1fr)}
.k{padding:10px 4px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:#38517A;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.25}
.k.o{background:#E8952F;border-color:#F3BE7A;color:#3A2200}
.k.g{background:#7FA53C;border-color:#A9C86E;color:#1E2A06}
.k.act{background:#2E8B57;border-color:#6ED09B}
.k.warn{background:#9B3226;border-color:#D07C6E}
.k.hint{animation:pulse 1.1s infinite;outline:2px solid var(--gold)}
@keyframes pulse{0%,100%{outline-color:rgba(221,181,102,.25)}50%{outline-color:rgba(221,181,102,1)}}
.k:active{transform:translateY(1px)}
.say{background:var(--sealSoft);border:1px solid var(--seal);border-radius:9px;padding:9px 11px;font-size:13.5px;margin:10px 0}
.say b{color:var(--gold)}
.msg{font-size:12.5px;padding:8px 11px;border-radius:8px;margin-top:8px;display:none}
.msg.bad{display:block;background:#3A1A16;border:1px solid #9B3226;color:#F2C3BA}
.msg.good{display:block;background:#12291F;border:1px solid #2E8B57;color:#B9E7CE}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px}
.prog{height:5px;border-radius:3px;background:var(--inkSoft);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.back{background:none;border:none;color:var(--sub);font-size:13px;padding:6px 0;cursor:pointer;font-family:inherit}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.foot{font-size:11.5px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.8}
.foot a{color:var(--gold)}
.big{font-size:26px;font-weight:800;color:var(--gold);text-align:center;margin:6px 0}
</style>
</head>

var mode="guide",cur=null,idx=0,err=0,DONE={};
try{DONE=JSON.parse(localStorage.getItem("posrich_done")||"{}")}catch(e){DONE={}}
function save(){try{localStorage.setItem("posrich_done",JSON.stringify(DONE))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function $(i){return document.getElementById(i)}

function setMode(m){mode=m;$("mGuide").className=m==="guide"?"on":"";$("mQuiz").className=m==="quiz"?"on":"";
 $("modenote").textContent=m==="guide"?"引導模式：該按的鍵會發亮，照著按走完整個流程。":"測驗模式：只給任務，不提示按鍵。按錯會記次數，最後算分。";
 if(cur)render();else home();}

function home(){
 cur=null;$("play").style.display="none";$("home").style.display="";
 var cats=[],seen={};FLOWS.forEach(function(f){if(!seen[f.cat]){seen[f.cat]=1;cats.push(f.cat)}});
 var h='<div class="card"><h2>選一個流程</h2><div class="flowlist">';
 cats.forEach(function(c){
  h+='<div class="catname">'+esc(c)+'</div>';
  FLOWS.filter(function(f){return f.cat===c}).forEach(function(f){
   h+='<button class="fbtn'+(DONE[f.id]?" done":"")+'" onclick="start(\''+f.id+'\')"><span class="dot"></span><span class="grow">'+esc(f.name)+'<small>'+esc(f.task)+'</small></span></button>';
  });
 });
 h+='</div></div>';
 var d=Object.keys(DONE).length;
 h+='<div class="card"><h2>進度</h2><div class="meta"><span>已完成 '+d+' / '+FLOWS.length+' 個流程</span><button class="back" onclick="reset()">清除紀錄</button></div><div class="prog"><i style="width:'+Math.round(d/FLOWS.length*100)+'%"></i></div></div>';
 $("home").innerHTML=h;
}
function reset(){DONE={};save();home()}

function start(id){cur=FLOWS.filter(function(f){return f.id===id})[0];idx=0;err=0;$("home").style.display="none";$("play").style.display="";render()}

function stepOf(){var s=cur.steps[idx];if(s.scr==="login"){return {scr:"login",title:"新交易基本資料",say:LOGIN.say,ok:LOGIN.ok,btns:LOGIN.btns,fields:LOGIN.fields}}
 if(s.scr==="menu1"){return {scr:"menu1",title:"POS RICH 功能列表（第一層）",say:s.say,ok:s.ok,btns:MENU1}}
 if(s.scr==="menu2"){return {scr:"menu2",title:s.cat+"（第二層）",say:s.say,ok:s.ok,btns:MENU2[s.cat]||[]}}
 return s;}

function render(){
 var s=stepOf(),n=cur.steps.length;
 var h='<button class="back" onclick="home()">‹ 回流程列表</button>';
 h+='<div class="card"><h2>'+esc(cur.cat)+' · '+esc(cur.name)+'</h2>';
 h+='<div class="meta"><span>任務：'+esc(cur.task)+'</span><span>STEP '+(idx+1)+' / '+n+'</span></div>';
 h+='<div class="prog"><i style="width:'+Math.round(idx/n*100)+'%"></i></div></div>';
 if(mode==="guide")h+='<div class="say">'+s.say+'</div>';
 h+='<div class="pos"><div class="tb"><span>'+esc(s.title||"")+'</span><span>SA · 練習</span></div><div class="bd">';
 (s.fields||[]).forEach(function(f){h+='<div class="fld"><span>'+esc(f[0])+'</span><b>'+esc(f[1])+'</b></div>'});
 if(s.out)h+='<div class="out">'+esc(s.out)+'</div>';
 if(!s.fields&&!s.out)h+='<div class="out">請在下方按鍵區操作</div>';
 h+='</div><div class="keys'+(s.scr==="menu1"?" m1":"")+'">';
 (s.btns||[]).forEach(function(b,i){
  var cls="k";
  if(s.scr==="menu1")cls+=" o";else if(s.scr==="menu2")cls+=" g";
  else if(/確認|儲存|存檔|完成|確定|核銷|暫確/.test(b))cls+=" act";
  else if(/作廢|取消|清除/.test(b))cls+=" warn";
  if(mode==="guide"&&b===s.ok)cls+=" hint";
  h+='<button class="'+cls+'" onclick="hit('+i+')">'+esc(b)+'</button>';
 });
 h+='</div></div><div id="msg" class="msg"></div>';
 h+='<div id="note" class="note">共 '+n+' 步・按錯 '+err+' 次</div>';
 $("play").innerHTML=h;
}

function hit(i){
 var s=stepOf(),b=(s.btns||[])[i];
 if(b===s.ok){
  idx++;
  if(idx>=cur.steps.length){finish();return}
  render();
  var m=$("msg");if(m){m.className="msg good";m.textContent="✓ 正確"}
 }else{
  err++;
  var m=$("msg");m.className="msg bad";
  m.innerHTML="✗ 不是這一鍵。"+(mode==="quiz"&&err>=2?"　提示："+s.say:"");
  var nt=$("note");if(nt)nt.textContent="共 "+cur.steps.length+" 步・按錯 "+err+" 次";
  var n=document.querySelectorAll(".k")[i];if(n){n.style.transform="translateX(3px)";setTimeout(function(){n.style.transform=""},120)}
 }
}

function finish(){
 DONE[cur.id]=1;save();
 var sc=Math.max(0,100-err*10);
 var h='<button class="back" onclick="home()">‹ 回流程列表</button>';
 h+='<div class="card"><h2>'+esc(cur.cat)+' · '+esc(cur.name)+' 完成</h2>';
 h+='<div class="big">'+(mode==="quiz"?sc+" 分":"✓ 走完")+'</div>';
 h+='<div class="meta"><span>按錯 '+err+' 次</span><span>共 '+cur.steps.length+' 步</span></div>';
 h+='<div class="note">'+esc(cur.task)+'</div></div>';
 h+='<div class="card"><h2>再練一次</h2><div class="flowlist">';
 h+='<button class="fbtn" onclick="start(\''+cur.id+'\')"><span class="dot"></span><span class="grow">重做這個流程</span></button>';
 var nx=FLOWS[FLOWS.map(function(f){return f.id}).indexOf(cur.id)+1];
 if(nx)h+='<button class="fbtn" onclick="start(\''+nx.id+'\')"><span class="dot"></span><span class="grow">下一個：'+esc(nx.name)+'<small>'+esc(nx.task)+'</small></span></button>';
 h+='<button class="fbtn" onclick="home()"><span class="dot"></span><span class="grow">回流程列表</span></button>';
 h+='</div></div>';
 $("play").innerHTML=h;
}

setMode("guide");
</script>
