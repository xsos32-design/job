let path=[];
const $=(i)=>document.getElementById(i);
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function current(){return path.length?path[path.length-1]:TREE}
function render(){
 const cur=current();
 let cb='<button class="crumb '+(path.length===0?"active":"")+'" onclick="jump(-1)">🏠 點別</button>';
 path.forEach((n,i)=>{cb+='<span class="sep">›</span><button class="crumb '+(i===path.length-1?"active":"")+'" onclick="jump('+i+')">'+esc(n.label)+'</button>'});
 $("crumbs").innerHTML=cb;
 $("backwrap").innerHTML=path.length?'<button class="back" onclick="back()">‹ 上一層</button>':"";
 $("view").innerHTML=cur.news?newsHTML():cur.cover?coverHTML():cur.doc?docHTML(cur):cur.alist?agradeHTML():cur.flist?flightsHTML():cur.fxlist?fxHTML():cur.note?noteHTML(cur.note):cur.content?leafHTML(cur.content):branchHTML(cur);
 window.scrollTo(0,0);
}
function branchHTML(n){
 const lead=n.label===TREE.label?"選擇點別":esc(n.label)+" — 請選擇";
 let h='';
 if(n.label===TREE.label&&typeof HOME_REMINDERS!=="undefined"&&HOME_REMINDERS.length){h+='<div class="home-remind">'+HOME_REMINDERS.map(x=>"📌 "+esc(x)).join("<br>")+'</div>';}
 h+='<div class="lead">'+lead+'</div><div class="cards">';
 n.children.forEach(c=>{h+='<button class="opt'+((c.news||c.cover||c.doc||c.alist||c.flist||c.fxlist)?' news':'')+'" onclick="go(\''+c.id+'\')"><span><span class="lbl">'+esc(c.label)+'</span>'+(c.sub?'<span class="osub">'+esc(c.sub)+'</span>':"")+'</span><span class="arr">›</span></button>'});
 return h+'</div>';
}
function numTbl(head,arr){let t='<table class="rtbl"><tr><th class="rnum">#</th><th>'+head+'</th></tr>';arr.forEach((x,i)=>{t+='<tr><td class="rnum">'+(i+1)+'</td><td class="rrule">'+esc(x)+'</td></tr>';});return t+'</table>';}
function grpTbl(h1,h2,groups){let t='<table class="rtbl"><tr><th class="rcat">'+h1+'</th><th>'+h2+'</th></tr>';groups.forEach(g=>{g.items.forEach((it,gi)=>{t+='<tr>'+(gi===0?'<td class="rcat" rowspan="'+g.items.length+'">'+esc(g.cat)+'</td>':'')+'<td class="rrule">'+esc(it)+'</td></tr>';});});return t+'</table>';}
function timeTbl(arr){let t='<table class="rtbl"><tr><th class="tcat">時段</th><th>內容</th></tr>';var re=/^(\d{1,2}:\d{2}(?:[-~]\d{1,2}:\d{2})?)\s*([\s\S]*)$/;arr.forEach(v=>{var ind=v.startsWith("　");var s=v.trim();var m=s.match(re);var tm=m?m[1]:"";var ct=m?m[2]:s;t+='<tr><td class="tcat">'+esc(tm)+'</td><td class="rrule"'+(ind?' style="padding-left:18px;color:var(--sub)"':'')+'>'+esc(ct)+'</td></tr>';});return t+'</table>';}
function sec(ic,t,b){return '<div class="sec"><div class="sec-h"><span>'+ic+'</span><span class="t">'+t+'</span><span class="rule"></span></div>'+b+'</div>'}
function leafHTML(c){
 let h='<div class="badges"><span class="b-sym">'+esc(c.sym)+'</span><span class="b-pos">'+((c.pos==="外場"||c.pos==="L9")?esc(c.pos):"POS "+esc(c.pos))+'</span></div>';
 h+=sec("📋","工作職掌",c.tasks.length?numTbl("工作項目",c.tasks):'<div class="none">本符號無固定職掌項目</div>');
 if(c.timing.length){
  h+=sec("🕐","時段 / 站位",timeTbl(c.timing));
 }
 if(c.proc&&c.proc.length){h+=sec("💰","帳後",numTbl("步驟",c.proc))}
var grp=c.ruleKeys.map(k=>({cat:RULES[k].title.replace("規則",""),items:RULES[k].items}));if(c.pos!=="外場"&&c.pos!=="L9"){CASHIER.forEach(g=>grp.push(g));}var rt='<table class="rtbl"><tr><th>分類</th><th>規則</th></tr>';grp.forEach(g=>{g.items.forEach((it,gi)=>{rt+='<tr>'+(gi===0?'<td class="rcat" rowspan="'+g.items.length+'">'+esc(g.cat)+'</td>':'')+'<td class="rrule">'+esc(it)+'</td></tr>';});});rt+='</table>';h+=sec("📜","規則",rt);
if(c.pos!=="外場"&&c.pos!=="L9"){h+='<details class="fx"><summary>💱 外幣收受</summary><div class="fxbody"><div class="fxnote">＊ '+esc(FX.note)+'</div>'+numTbl("步驟",FX.steps)+'</div></details>';h+='<details class="fx"><summary>🗑️ 作廢代號</summary><div class="fxbody">'+numTbl("作廢原因",VOID)+'</div></details>';var cg=[{cat:"通則",items:CURRENCY.general}].concat(CURRENCY.items.map(it=>({cat:it[0],items:it[1]})));h+='<details class="fx"><summary>🚫 不收幣別／版本</summary><div class="fxbody">'+grpTbl("幣別","內容",cg)+'</div></details>';var ct='<table class="rtbl" style="font-size:12px"><tr><th>卡別</th><th>碼數</th><th>開頭</th><th>防偽</th></tr>'+CARD.types.map(t=>'<tr><td class="rcat">'+esc(t[0])+'</td><td class="rrule">'+esc(t[1])+'</td><td class="rrule">'+esc(t[2])+'</td><td class="rrule">'+esc(t[3])+'</td></tr>').join("")+'</table>';var cgrp=[{cat:"銀聯卡",items:CARD.unionpay},{cat:"收授規範",items:CARD.rules},{cat:"可疑處理",items:CARD.suspect},{cat:"感應／其他",items:CARD.sense}];h+='<details class="fx"><summary>💳 信用卡</summary><div class="fxbody">'+ct+grpTbl("分類","內容",cgrp)+'</div></details>';h+='<details class="fx"><summary>🧾 旅行支票 T/C</summary><div class="fxbody">'+numTbl("注意事項",TC)+'</div></details>';h+='<details class="fx"><summary>📅 屆期抄寫</summary><div class="fxbody">'+grpTbl("分類","內容",EXPIRY.map(s=>({cat:s.h,items:s.items})))+'</div></details>';h+='<details class="fx"><summary>📦 盤點作業</summary><div class="fxbody">'+grpTbl("分類","內容",STOCK.map(s=>({cat:s.h,items:s.items})))+'</div></details>';}
 return h;
}
function fxHTML(){

 return '<div class="note-title">💱 外幣收受</div>'+
  '<div class="note-meta" style="color:var(--seal);font-weight:700">＊ '+esc(FX.note)+'</div>'+

 let t='<table><tr><th>航班代號</th><th>目的地</th></tr>'+rows+'</table>';

 if(n.sub)h+='<div class="note-meta">'+esc(n.sub)+'</div>';
 n.sections.forEach(s=>{h+=sec("📌",s.h,"<ul>"+s.items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>")});
 return h;
}

 return '<div class="note-title">📢 '+esc(NEWS.date)+'</div>'+
  sec("⚠️","異動事項","<ol>"+NEWS.items.map(x=>'<li>'+esc(x)+'</li>').join("")+"</ol>");

 n.manpower.rows.forEach((r,i)=>{
  const tot=r==="L2總";

 t+='</table>';
 return '<div class="note-title">'+k+' 說明</div><div class="note-meta">'+esc(n.meta)+'</div>'+
  sec("👥","人力配置（由多到少）",t)+
  sec("ℹ️","說明事項",numTbl("說明事項",n.items));

function extrasHTML(){
 let h='';
 h+='<details class="fx"><summary>💱 外幣收受</summary><div class="fxbody"><div class="fxnote">＊ '+esc(FX.note)+'</div><ol>'+FX.steps.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ol></div></details>';
 h+='<details class="fx"><summary>🗑️ 作廢代號</summary><div class="fxbody"><ol>'+VOID.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ol></div></details>';
 let cy='<details class="fx"><summary>🚫 不收幣別／版本</summary><div class="fxbody"><ul class="cur-gen">'+CURRENCY.general.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul>';
 CURRENCY.items.forEach(it=>{cy+='<div class="cur-cy">'+esc(it[0])+'</div><ul>'+it[1].map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul>';});
 h+=cy+'</div></details>';
 let cc='<details class="fx"><summary>💳 信用卡</summary><div class="fxbody"><table style="font-size:12px"><tr><th>卡別</th><th>碼數</th><th>開頭</th><th>防偽</th></tr>'+CARD.types.map(t=>'<tr><td class="lab">'+esc(t[0])+'</td><td>'+esc(t[1])+'</td><td>'+esc(t[2])+'</td><td>'+esc(t[3])+'</td></tr>').join('')+'</table>';
 cc+='<div class="cur-cy">銀聯卡</div><ul>'+CARD.unionpay.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';
 cc+='<div class="cur-cy">收授規範</div><ul>'+CARD.rules.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';
 cc+='<div class="cur-cy">可疑處理</div><ul>'+CARD.suspect.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';
 cc+='<div class="cur-cy">感應／其他</div><ul>'+CARD.sense.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';
 h+=cc+'</div></details>';
 h+='<details class="fx"><summary>🧾 旅行支票 T/C</summary><div class="fxbody"><ul>'+TC.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul></div></details>';
 let ex='<details class="fx"><summary>📅 屆期抄寫</summary><div class="fxbody">';
 EXPIRY.forEach(sx=>{ex+='<div class="cur-cy">'+esc(sx.h)+'</div><ul>'+sx.items.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';});
 h+=ex+'</div></details>';
 let sk='<details class="fx"><summary>📦 盤點作業</summary><div class="fxbody">';
 STOCK.forEach(sx=>{sk+='<div class="cur-cy">'+esc(sx.h)+'</div><ul>'+sx.items.map(x=>"<li>"+esc(x)+"</li>").join('')+'</ul>';});
 h+=sk+'</div></details>';
 return h;
}
let coverSel=[];
function coverToggle(id){const i=coverSel.indexOf(id);if(i<0)coverSel.push(id);else coverSel.splice(i,1);render();}
function coverClear(){coverSel=[];render();}
function coverLeaves(){let a=[];(function w(n){if(n.content&&n.content.sym)a.push(n);(n.children||[]).forEach(w);})(TREE);return a;}
function coverHTML(){
 let leaves=coverLeaves();
 let h='<div class="lead">選擇你要頂的符號（可多選，例：6號＋3號）</div>';
 [['2140','一組 · B 符號'],['2153','二組 · T 符號']].forEach(function(g){var st=g[0],lbl=g[1];
  h+='<div class="cover-store">'+lbl+'</div><div class="cover-chips">';
  leaves.filter(l=>l.id.indexOf(st)===0).forEach(l=>{var on=coverSel.indexOf(l.id)>=0;h+='<button class="chip'+(on?' on':'')+'" onclick="coverToggle(\''+l.id+'\')">'+esc(l.content.sym)+'</button>';});
  h+='</div>';
 });
 if(!coverSel.length){h+='<div class="cover-hint">請至少選 1 個符號</div>';return h;}
 h+='<div class="cover-sum">已選 '+coverSel.length+' 個：'+coverSel.map(id=>esc(findById(id).content.sym)).join('、')+' <button class="chip-clr" onclick="coverClear()">清除</button></div>';
 coverSel.forEach(id=>{var c=findById(id).content;
  h+='<div class="badges"><span class="b-sym">'+esc(c.sym)+'</span><span class="b-pos">'+((c.pos==="外場"||c.pos==="L9")?esc(c.pos):"POS "+esc(c.pos))+'</span></div>';
  if(c.tasks.length)h+=sec("📋","職掌 · "+esc(c.sym),"<ul>"+c.tasks.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>");
  if(c.timing.length)h+=sec("🕐","時段 · "+esc(c.sym),'<div style="display:grid;gap:6px">'+c.timing.map(t=>{var ind=t.startsWith("　"),s2=!ind&&/^[0-9]/.test(t);return '<div class="tline'+(s2?" strong":"")+(ind?" indent":"")+'">'+esc(t.trim())+'</div>';}).join("")+'</div>');
  if(c.proc&&c.proc.length)h+=sec("💰","帳後 · "+esc(c.sym),"<ol>"+c.proc.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>");
 });
 let rk=[];coverSel.forEach(id=>findById(id).content.ruleKeys.forEach(k=>{if(rk.indexOf(k)<0)rk.push(k);}));
 rk.forEach(k=>{h+=sec("📜",RULES[k].title,"<ol>"+RULES[k].items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>");});
 let anyM=coverSel.some(id=>{var c=findById(id).content;return c.pos!=="外場"&&c.pos!=="L9";});
 if(anyM)h+=extrasHTML();
 return h;
}

function findById(id,n){n=n||TREE;if(n.children){for(const c of n.children){if(c.id===id)return c;const f=findById(id,c);if(f)return f}}return null}
function go(id){const n=findById(id);if(n)path.push(n);render()}
function back(){path.pop();render()}
function jump(i){path=i<0?[]:path.slice(0,i+1);render()}
render();
</script></body></html>
