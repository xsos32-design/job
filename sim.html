function xe(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function sv(h,inner){return '<svg viewBox="0 0 300 '+h+'" class="pic" preserveAspectRatio="xMidYMid meet" role="img">'+inner+'</svg>'}
function bar(title,w){return '<rect x="0" y="0" width="300" height="18" fill="#153A6B"/><text x="8" y="12.5" font-size="9" font-weight="700" fill="#DCE7F5">'+xe(title)+'</text><text x="292" y="12.5" font-size="8" fill="#8FA9CC" text-anchor="end">SA 練習</text>'}
function winSVG(o){
 var f=o.fields||[],n=f.length,note=o.note?String(o.note).split("\n").slice(0,3):[],h=26+n*20+note.length*11+10;
 var s=bar(o.title||"");
 f.forEach(function(x,i){var y=26+i*20,fo=(i===o.focus);
  s+='<text x="10" y="'+(y+10)+'" font-size="8.5" fill="#9FB6D4">'+xe(x[0])+'</text>';
  s+='<rect x="92" y="'+y+'" width="176" height="14" rx="2" fill="#FFFFFF" stroke="'+(fo?"#E8952F":"#50688C")+'" stroke-width="'+(fo?2:1)+'"/>';
  s+='<text x="97" y="'+(y+10.5)+'" font-size="8.5" fill="#16233A">'+xe(x[1]||"")+'</text>';
  if(fo)s+='<circle cx="278" cy="'+(y+7)+'" r="6" fill="#E8952F"/><text x="278" y="'+(y+10)+'" font-size="7.5" font-weight="700" fill="#3A2200" text-anchor="middle">!</text>';
 });
 note.forEach(function(l,i){s+='<text x="10" y="'+(26+n*20+12+i*11)+'" font-size="8" fill="#8FA9CC">'+xe(l)+'</text>'});
 return sv(h,'<rect width="300" height="'+h+'" fill="#0B2545"/>'+s);
}
function listSVG(o){
 var L=(o.lines||[]).slice(0,14),h=26+L.length*13+8,s=bar(o.title||"");
 L.forEach(function(l,i){var y=24+i*13;
  s+='<rect x="8" y="'+y+'" width="284" height="12" fill="'+(i%2?"#0E2B4E":"#123255")+'"/>';
  s+='<text x="12" y="'+(y+9)+'" font-size="8" fill="#CBD9EC">'+xe(l)+'</text>';
 });
 return sv(h,'<rect width="300" height="'+h+'" fill="#0B2545"/>'+s);
}
function menuSVG(keys,target,g){
 var n=keys.length,rows=Math.ceil(n/4),h=26+rows*25+14,s=bar(g?"POS RICH 第二層功能":"POS RICH 功能列表（第一層）");

var G={t:null,i:0,fl:null,fi:0,ferr:0};
function gActive(){return !!G.t}
function gKeyWanted(){if(!G.t)return null;var st=G.t.steps[G.i];return st&&st.n.k?st.n.k:null}
function gFieldWanted(){if(!G.t)return null;var st=G.t.steps[G.i];return st&&st.n.f?st.n.f:null}
function gScanWanted(){if(!G.t)return false;var st=G.t.steps[G.i];return !!(st&&st.n.a==="add")}
function gCond(c){
 if(!c)return true;
 if(c==="trade")return S.scr==="trade";
 if(c==="pay")return S.scr==="pay";
 if(c==="done")return S.scr==="done";
 if(c==="paid")return S.pays.length>0;
 if(c==="qty")return S.items.length&&S.items[0].qty>1;
 if(c==="empty")return S.items.length===0;
 return true;
}
function gHit(kind,val){
 if(!G.t)return;
 var st=G.t.steps[G.i];if(!st)return;
 var n=st.n,ok=false;
 if(kind==="k"&&n.k&&n.k===val)ok=true;
 if(kind==="f"&&n.f&&n.f===val)ok=true;
 if(kind==="a"&&n.a&&n.a===val)ok=true;
 if(!ok||!gCond(st.c))return;
 G.i++;
 if(G.i>=G.t.steps.length){var nm=G.t.name;G.t=null;gBand();say("🎉 完成「"+nm+"」！可以再選一個流程，或自由操作。");render();return}
 say("✓ 這一步對了。下一步："+G.t.steps[G.i].s.replace(/<[^>]+>/g,""));
 gBand();
}
function gBand(){
 var b=document.getElementById("gband");

  +'<span>活動名稱：</span><input id="actnm" readonly value="'+esc(actName(d.code))+'" style="width:190px;'+FIN+';background:#EEF1F7">'
  +'</div>';
 ACTS.forEach(function(a,i){
  var on=(String(d.code||"").toUpperCase()===a[0]);
  h+='<div class="prow" onclick="actPick('+i+')"'+(on?' style="background:#2C4B8C;color:#fff"':'')+'>'
   +'<b style="min-width:44px">'+a[0]+'</b><span style="flex:1">'+a[1]+'</span></div>';
 });
 h+='<div style="display:flex;gap:5px;margin-top:10px">'
  +'<button class="btn" style="flex:1" onclick="closeOv()">取消(Esc)</button>'
  +'<button class="btn" style="flex:1" onclick="actReset()">清除(C+Bak)</button>'
  +'<button class="btn" style="flex:1" onclick="actQuery()">查詢(A+Q)</button>'
  +'<button class="btn" style="flex:1" onclick="actRemove()">活動清除</button>'
  +'<button class="btn" style="flex:1" onclick="actApply()">輸入(A+E)</button></div>';
 h+='<div class="tiny" style="margin-top:8px">點一列直接選，或打代號再按「輸入(A+E)」。帶進去之後上面標題列的「活動代碼：」會顯示出來。</div>';
 return h+'</div></div>';
}
function actPaint(){var e=document.getElementById("actnm");if(e)e.value=actName(S.ovData.code)}
function actPick(i){S.ovData.code=ACTS[i][0];S.ovData.sel=i;render()}
function actReset(){S.ovData={code:"",sel:-1};render()}
function actQuery(){var c=String(S.ovData.code||"").toUpperCase(),n=actName(c);
 say(n?("查到："+c+"　"+n):("查無活動代號「"+(c||"(空白)")+"」，請從清單點選。"));render()}
function actRemove(){S.act="";S.actName="";S.ovData={code:"",sel:-1};
 say("已清除本筆的活動代碼。");render()}
function actApply(){
 var c=String(S.ovData.code||"").toUpperCase(),n=actName(c);
 if(!n){say("活動代號「"+(c||"(空白)")+"」查無資料，請從清單點選。");render();return}
 S.act=c;S.actName=n;S.ov=null;S.ovData=null;
 say("本筆帶入活動代碼 "+c+"　"+n+"。結帳前記得確認活動品項和贈品條件有沒有符合。");render();
}
function mergeHTML(){
 var d=S.ovData||{v:["","","","","","","","","",""]};
 var h='<div class="card2" style="min-width:520px"><h3>併單紀錄</h3><div class="bd">';
 h+='<div style="font-size:13px;font-weight:700;margin-bottom:9px">售貨單號輸入</div>';
 h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 16px">';
 for(var i=0;i<10;i++){
  h+='<div style="display:flex;gap:5px;align-items:center;font-size:12px">'
   +'<span style="min-width:50px;text-align:right">單號'+(i+1)+'：</span>'
   +'<input value="'+esc(d.v[i]||"")+'" inputmode="numeric" oninput="S.ovData.v['+i+']=this.value" style="flex:1;min-width:0;'+FIN+'"></div>';
 }
 h+='</div><div style="display:flex;gap:5px;margin-top:11px">'
  +'<button class="btn" style="flex:1" onclick="closeOv()">取消</button>'
  +'<button class="btn" style="flex:1" onclick="mergeReset()">清除</button>'
  +'<button class="btn" style="flex:1" onclick="mergeKeypad()">OpenKeypad</button>'
  +'<button class="btn" style="flex:1" onclick="mergeApply()">輸入</button></div>';
 h+='<div class="tiny" style="margin-top:8px">同一位客人分開打的幾張單，把售貨單號填進來合併成一筆結帳，最多十張。</div>';
 return h+'</div></div>';
}
function mergeReset(){S.ovData={v:["","","","","","","","","",""]};render()}
function mergeKeypad(){say("真機上這顆會叫出軟鍵盤；這台是模擬機，直接點欄位用自己的鍵盤打就好。");render()}
function mergeApply(){
 var list=(S.ovData.v||[]).map(function(x){return String(x||"").trim()}).filter(Boolean);
 if(!list.length){say("還沒有輸入任何售貨單號。");render();return}
 S.merges=list;S.ov=null;S.ovData=null;
 say("已併入 "+list.length+" 張單號："+list.join("、")+"。結帳金額會是這幾張的合計。");render();
}
function delqHTML(){
 var it=S.items[S.sel];
 if(!it)return '<div class="card2"><h3>確認訊息</h3><div class="bd">沒有選到商品。<br><br><button class="btn" style="width:110px" onclick="closeOv()">關閉</button></div></div>';
 return '<div class="card2"><h3>確認訊息</h3><div class="bd" style="font-size:13px;line-height:1.95">'
  +'商品名稱：'+esc(it.name)+'<br>商品數量：'+it.qty+'<br>是否刪除？<br><br>'
  +'<button class="btn" style="width:110px;display:inline-block" onclick="delYes()">是(Y)</button>　'
  +'<button class="btn" style="width:110px;display:inline-block" onclick="closeOv()">否(N)</button></div></div>';
}
function delYes(){
 if(S.sel<0||!S.items[S.sel]){closeOv();return}
 var n=S.items[S.sel].name;S.items.splice(S.sel,1);S.sel=-1;
 S.ov=null;S.ovData=null;say("已刪除「"+n+"」。");render();
}
function payqHTML(){
 return '<div class="card2"><h3>確認訊息</h3><div class="bd" style="font-size:13px;line-height:1.95">'
  +'應收總金額：'+money(total())+'<br>付款總金額：'+money(paid())+'<br>是否進行結帳？<br><br>'
  +'<button class="btn" style="width:110px;display:inline-block" onclick="payYes()">是(Y)</button>　'
  +'<button class="btn" style="width:110px;display:inline-block" onclick="closeOv()">否(N)</button>'
  +'<div class="tiny" style="margin-top:9px">收外幣的時候這一行要看清楚：付款總金額是折合台幣後的數字，找零一律找台幣。</div>'
  +'</div></div>';
}
function payYes(){S.ov=null;S.ovData=null;S.scr="done";say("付款完成，印出銷售單。");render()}

function ovHTML(){
 if(S.ov==="pq")return pqHTML();
 if(S.ov==="rich1")return rich1HTML();
 if(S.ov==="rich2")return rich2HTML();
 var h='<div class="ov" onclick="if(event.target===this)closeOv()">';
 if(S.ov==="picker")return h+pickerHTML()+'</div>';
 if(S.ov==="chg")return h+chgHTML()+'</div>';
 if(S.ov==="gf")return h+flowHTML()+'</div>';
 if(S.ov==="act")return h+actHTML()+'</div>';
 if(S.ov==="merge")return h+mergeHTML()+'</div>';
 if(S.ov==="delq")return h+delqHTML()+'</div>';
 if(S.ov==="payq")return h+payqHTML()+'</div>';
 if(S.ov==="fx"){
  h+='<div class="card2"><h3>匯率表</h3><div class="bd">';
  h+='<table style="font-size:13px;border-collapse:collapse"><tr><th style="text-align:left;padding:3px 10px">代碼</th><th style="text-align:left;padding:3px 10px">幣別</th><th style="text-align:right;padding:3px 10px">匯率</th></tr>';
  FX.forEach(function(r){h+='<tr><td style="padding:3px 10px">'+r[0]+'</td><td style="padding:3px 10px">'+r[1]+'</td><td style="padding:3px 10px;text-align:right">'+r[2].toFixed(5)+'</td></tr>'});
  h+='</table><div class="tiny" style="margin-top:8px">外幣一律只收紙鈔，硬幣不收。</div>';
  h+='<button class="btn" style="margin-top:10px;width:90px" onclick="closeOv()">關閉</button></div></div>';
 }
 if(S.ov==="bp"){
  h+='<div class="card2"><h3>刷登機證</h3><div class="bd">';
  h+='<div class="bp" onclick="scanBP()"><div class="qr"></div><div style="font-size:13px;line-height:1.7">'
   +'<b>BOARDING PASS</b><br>'+BP.name+'<br>班機 '+BP.flight+'　　座位 '+BP.seat+'<br>登機門 '+BP.gate+'　　'+BP.dep+'</div></div>';
  h+='<div class="tiny" style="margin-top:8px">點登機證上的 QR 碼模擬掃描。</div>';
  h+='<button class="btn" style="margin-top:10px;width:90px" onclick="closeOv()">取消</button></div></div>';
 }
 if(S.ov==="plist"){
  h+='<div class="card2" style="min-width:420px"><h3>'+(S.ovData==="price"?"查價":"商品查詢")+'</h3><div class="bd">';
  h+='<div class="tiny" style="margin-bottom:6px">※ 這裡只查資料，不會把商品打進單身；要加入商品請用交易畫面右邊的「掃描商品條碼」。</div>';
  PRODUCTS.forEach(function(p,i){
   h+='<div class="prow" style="border:1px solid #C3CCDD;margin-bottom:4px" onclick="'+(S.ovData==="price"?'showPrice('+i+')':'showInfo('+i+')')+'"><b style="min-width:120px">'+p[0]+'</b><span style="flex:1">'+p[1]+'</span><span style="font-weight:700">NT$ '+money(p[2])+'</span></div>';
  });
  h+='<button class="btn" style="margin-top:6px;width:90px" onclick="closeOv()">關閉</button></div></div>';
 }
 if(S.ov==="rich"){
  var amt=S.ovData,big=amt>3000;
  h+='<div class="card2"><h3>RICH Pay</h3><div class="bd" style="font-size:13px;line-height:1.9">';
  h+='金額：NT$ '+money(amt)+'<br>① 請客人打開 APP 按「支付」並輸入支付密碼<br>② 請客人出示三合一會員付款條碼<br>③ 掃描後：'+(big?'<b style="color:#B03A1E">超過 3,000 元 → 傳送 OTP 驗證碼</b>':'<b style="color:#1E7F91">3,000 元以下 → 直接取款印單</b>');
  h+='<br><br><button class="btn" style="width:150px;display:inline-block" onclick="richDone('+amt+','+(big?1:0)+')">'+(big?"客人輸入 OTP 完成":"掃描完成")+'</button> ';
  h+='<button class="btn" style="width:80px;display:inline-block" onclick="closeOv()">取消</button></div></div>';
 }
 if(S.ov==="preview"){
  h+='<div class="card2" style="min-width:420px"><h3>商品預覽</h3><div class="bd">';
  S.items.forEach(function(it,i){h+='<div class="prow"><b>'+(i+1)+'</b><span style="flex:1">'+esc(it.name)+'</span><span>×'+it.qty+'</span><span style="font-weight:700;min-width:80px;text-align:right">NT$ '+money(it.price*it.qty)+'</span></div>'});
  h+='<div style="text-align:right;font-weight:700;margin-top:6px">合計 NT$ '+money(total())+'</div>';
  h+='<button class="btn" style="margin-top:8px;width:90px" onclick="closeOv()">關閉</button></div></div>';
 }
 return h+'</div>';
}
function closeOv(){if(S.ov==="gf")G.fl=null;S.ov=null;S.ovData=null;render()}
function setFlight(f){
 S.flight=f;S.dep=BP.dep;S.focus="";S.panel="guide";
 say("班機帶入 "+f+"（從航班選擇表選的）。出境日 "+BP.dep+"。");gHit("a","bp");render();
}
function scanBP(){S.flight=BP.flight;S.dep=BP.dep;S.ov=null;S.focus="";S.panel="guide";say("登機證掃描成功：班機 "+BP.flight+"、出境日 "+BP.dep+" 已帶入。");gHit("a","bp");render()}
function showPrice(i){var p=PRODUCTS[i];say("查價："+p[1]+"　NT$ "+money(p[2]));closeOv()}
function showInfo(i){var p=PRODUCTS[i];say("商品查詢："+p[1]+"｜條碼 "+p[0]+"｜單價 NT$ "+money(p[2])+"（查詢不會帶入單身）");gHit("a","info");closeOv()}
if(top!==self){var _h=document.querySelector('header');if(_h)_h.style.display='none';var _f=document.querySelector('.foot');if(_f)_f.style.display='none';document.querySelector('.top').style.paddingTop='0';document.body.style.background='transparent';}
if(innerWidth<760){ZOOM=0.62;document.getElementById('zfit').classList.remove('on');document.getElementById('mtip').style.display='block';}
resetAll();
setTimeout(tellHeight,80);window.addEventListener("load",tellHeight);
</script>
</body>
</html>
